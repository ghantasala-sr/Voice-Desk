# Handoff policy for the ticketing domain. docs/09-handoff.md.
#
# Every threshold tagged PROVISIONAL is a placeholder until week-3 calibration
# (W3-7, W3-8) replaces it with a value derived from the eval set's score
# distribution, with a comment naming the run directory it came from. Handoff
# metrics must not be quoted as final while any PROVISIONAL tag remains.
version: 1

hard_rules:
  - id: explicit_human_request
    match: utterance_pattern
    # Recall matters more than precision here: a missed request for a human is
    # the worst handoff failure there is. Every phrasing that has slipped past
    # gets added, with a test in tests/test_handoff.py.
    patterns:
      - "\\b(talk|speak|chat) (to|with) (a |an |the |your |some )?(human|person|agent|representative|rep|someone|somebody|manager|supervisor|real person)\\b"
      - "\\breal (person|human)\\b"
      - "\\b(get|give|put) me (through to )?(a |an |the |your )?(manager|supervisor|human|person|someone)\\b"
      - "\\b(i want|i need|i'd like) (a |an |the |your )?(manager|supervisor|human|person)\\b"
      - "\\btransfer me\\b"
      - "\\boperator\\b"

  - id: payment_dispute
    match: utterance_pattern
    patterns:
      - "\\bchargeback\\b"
      - "\\bdisput(e|ed|ing) (the |a |this |that )?(charge|payment|transaction)"
      - "\\b(didn't|did not|never) authori[sz]e"
      - "\\bfraud(ulent)?\\b"
      - "\\bunauthori[sz]ed\\b"

  - id: distress
    match: utterance_pattern
    patterns:
      - "\\b(emergency|ambulance|heart attack|can'?t breathe|overdose)\\b"
      - "\\b(kill|hurt) (myself|someone)\\b"

  - id: verification_failed
    match: state
    max_failures: 2

  - id: tool_state_unknown
    match: state

  - id: retrieval_unavailable
    match: state

  - id: checker_failed_twice
    match: state
    max_failures: 2

soft_signals:
  retrieval_insufficient:
    weight: 0.45
    # CALIBRATED — results/2026-10-13-retrieval-calibration/ (n=36 covered,
    # 28 uncovered). Raw dense cosine of the best chunk (AUC 0.91), NOT the
    # fused margin (AUC 0.53). Lowest threshold catching >= 90% of uncovered
    # queries: recall 26/28, at a 13/36 false-alarm rate on covered ones.
    # That false-alarm rate is why this stays a SOFT signal that cannot hand
    # off on its own.
    threshold_top_vec_score: 0.688

  retrieval_very_weak:
    # A second, stricter level that CAN hand off on its own (weight >= the 0.6
    # threshold). CALIBRATED — results/2026-10-13-handoff-calibration/: on 79
    # non-tool cases it lifts handoff recall from 0.31 to 0.81 at precision
    # 0.79. Raising it to 0.688 adds 3 catches for 6 false handoffs, mostly
    # everyday refund questions, which would gut containment.
    weight: 0.60
    threshold_top_vec_score: 0.62

  entity_confidence_low:
    weight: 0.30
    threshold: 0.60                 # PROVISIONAL

  rephrase_repeat:
    weight: 0.35
    trigger_count: 2
    # Cosine on utterance EMBEDDINGS, not word overlap: a caller rephrasing
    # deliberately uses different words — that is what rephrasing is. Off
    # when no embedder is available (the harness then has no way to see it).
    similarity: 0.82                # PROVISIONAL

  checker_failure:
    weight: 0.40

  tool_failure:
    weight: 0.50

  budget_exceeded_repeat:
    weight: 0.30
    trigger_count: 2

  iteration_cap_reached:
    weight: 0.45

  llm_failure:
    weight: 0.60

  negative_sentiment:
    weight: 0.20

threshold: 0.60       # PROVISIONAL — W3-8
decay_per_turn: 0.5

checker:
  # Rule 2: fraction of a policy claim's distinctive content words that must
  # appear in the retrieved chunks for it to count as supported. docs/08 §3.
  # CALIBRATED — results/2026-10-13-checker-catch-rate/: 0.25 -> 0.50 lifts
  # fabricated-claim catch from 3/8 to 6/8 with no added false positives on
  # correct answers under weak retrieval (2/10 at every value 0.25-0.65).
  claim_overlap_min: 0.50
