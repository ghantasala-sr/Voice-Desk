<!doctype html>
<meta charset="utf-8">
<title>VoiceDesk</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg: #11131a; --panel: #1a1d27; --line: #2a2f3d;
    --text: #e6e8ef; --dim: #8b92a6; --accent: #6ea8fe;
    --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); height: 100vh;
         display: grid; grid-template-rows: auto 1fr auto; }
  header { padding: 12px 20px; border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: 16px; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  #status { font-size: 12px; color: var(--dim); }
  main { display: grid; grid-template-columns: 1fr 380px; overflow: hidden; }
  #transcript { overflow-y: auto; padding: 20px; display: flex;
                flex-direction: column; gap: 10px; }
  #trace { overflow-y: auto; padding: 16px; border-left: 1px solid var(--line);
           background: var(--panel); font-size: 12px; }
  .msg { max-width: 72%; padding: 9px 13px; border-radius: 12px; line-height: 1.45; }
  .user  { align-self: flex-end; background: #2b3550; }
  .agent { align-self: flex-start; background: #202533; }
  .agent.cancelled { opacity: .45; text-decoration: line-through; }
  .ev { padding: 5px 0; border-bottom: 1px solid var(--line); color: var(--dim);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ev b { color: var(--accent); font-weight: 600; }
  .ev.barge_in b, .ev.context_trimmed b { color: var(--warn); }
  .ev.error b, .ev.budget_exceeded b { color: var(--bad); }
  footer { border-top: 1px solid var(--line); padding: 12px 20px;
           display: flex; align-items: center; gap: 14px; }
  button { background: var(--accent); color: #0b0e14; border: 0; padding: 9px 18px;
           border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; }
  button.stop { background: var(--bad); }
  button:disabled { opacity: .4; cursor: default; }
  #stages { display: flex; gap: 3px; flex: 1; align-items: center; font-size: 11px; }
  .stage { padding: 3px 7px; border-radius: 4px; background: #232838; color: var(--dim);
           white-space: nowrap; }
  .stage.endpoint { background: #3a2f1a; color: var(--warn); }
  .stage.total { background: #1d3326; color: var(--ok); margin-left: auto; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); margin: 0 0 8px; }
</style>

<header>
  <h1>VoiceDesk</h1>
  <span id="status">disconnected</span>
</header>

<main>
  <div id="transcript"></div>
  <div id="trace"><h2>Trace</h2><div id="events"></div></div>
</main>

<footer>
  <button id="mic">Start call</button>
  <div id="stages">
    <span class="stage">no turn yet</span>
  </div>
</footer>

<script src="/static/client.js"></script>
