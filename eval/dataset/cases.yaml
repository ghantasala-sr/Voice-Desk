  - id: refund_cannot_attend
    group: covered
    intent: refund_request
    utterance: "Something came up and I can't go on Saturday anymore. Do I get my money back?"
    expected:
      type: answer
      citation_docs: [01-refunds-and-exchanges.md]
      must_contain: ["non-refundable"]
      must_not_contain: ["refund approved", "you will receive a refund", "I've refunded"]
      should_escalate: false
    retrieval: covered
    difficulty: easy

