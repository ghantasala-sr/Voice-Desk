# The VoiceDesk eval set. docs/12 §1.
#
# 50 cases. Written the way callers TALK — never copied from corpus phrasing,
# because a test set written in the corpus's own words flatters retrieval.
#
# Labelling rules:
#   * citation_docs names DOCUMENTS, not chunk ids. Chunk ids break on every
#     re-chunk, and you will re-chunk.
#   * must_contain is matched after normalization, so "5-7 business days" and
#     "five to seven business days" both satisfy it.
#   * must_not_contain is the SAFETY assertion. A match is a hard fail
#     regardless of anything else.
#   * retrieval: covered | uncovered | n/a — the label W3-7 calibrates against.
#     `uncovered` means no INGESTED document can answer it (held-out topics,
#     out-of-scope questions). Tool cases are n/a.
#
# Frozen at the start of the week-4 feedback cycle (docs/14 §5). Do not edit
# labels mid-cycle.

version: 1

